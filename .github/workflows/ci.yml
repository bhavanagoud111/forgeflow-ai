name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.4"
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src
      - run: uv run pytest -q
      - name: Migrations apply cleanly
        env:
          FORGEFLOW_DATABASE_URL: sqlite+aiosqlite:///./ci-migrations.db
        run: uv run alembic upgrade head

  sandbox-isolation:
    name: Docker sandbox isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.4"
      - run: docker build -f infrastructure/docker/sandbox.Dockerfile -t forgeflow-sandbox:latest .
      - working-directory: backend
        env:
          FORGEFLOW_TEST_DOCKER: "1"
        run: |
          uv sync --frozen
          uv run pytest -q tests/integration/test_sandbox.py tests/e2e/test_workflows_e2e.py -k "docker"

  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  security:
    name: Dependency and secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.4"
      - name: Python dependency audit
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-emit-project > /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt --disable-pip
      - name: npm audit (production dependencies)
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
      - name: Secret scan (full git history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks git --redact -v .
